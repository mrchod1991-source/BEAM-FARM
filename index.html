      content="เกมจำลองฟาร์ม 3 มิติครบวงจร ปลูกผัก เลี้ยงสัตว์ ขี่ม้า ใช้โดรนเก็บเกี่ยว และสำรวจชนบท"

      property="og:description"
      content="เกมจำลองฟาร์ม 3 มิติครบวงจร ปลูกผัก เลี้ยงสัตว์ ขี่ม้า ใช้โดรนเก็บเกี่ยว และสำรวจชนบท"

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BeamFarm" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128x128.png" />
    <script>
      (function () {
        try {
          if ('caches' in window) {
            window.caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                if (
                  k.indexOf('realistic-fishing-3d') === 0 ||
                  k.indexOf('beam-farm-3d') === 0
                ) {
                  window.caches.delete(k);
                }
              });
            });
          }
          window.addEventListener('vite:preloadError', function () {
            if (window.__BEAM_FARM_RUNNING__) {
              return;
            }
            var lastReload = Number(sessionStorage.getItem('beam_farm_chunk_reload') || '0');
            if (!lastReload || Date.now() - lastReload > 60000) {
              sessionStorage.setItem('beam_farm_chunk_reload', String(Date.now()));
              window.location.reload();
            }
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="margin:0;padding:0;background-color:#120c09;color:#f5f5f4;">
    <div id="root">
      <div
        style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#120c09;color:#fde68a;font-family:system-ui,-apple-system,sans-serif;gap:10px;"
      >
        <div style="font-size:22px;font-weight:800;letter-spacing:0.06em;">BEAM FARM 3D</div>
        <div style="font-size:13px;color:#a8a29e;">กำลังโหลดโลกฟาร์ม 3 มิติ...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
